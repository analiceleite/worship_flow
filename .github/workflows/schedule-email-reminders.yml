name: Schedule Email Reminders

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  enqueue-and-process:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Enqueue published schedule notifications
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/notifications/schedule/enqueue-published" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'

      - name: Enqueue D-7 reminders
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/notifications/schedule/enqueue-reminder-7days" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'

      - name: Enqueue D-1 reminders
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/notifications/schedule/enqueue-reminder-1day" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'

      - name: Process queue
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/notifications/schedule/process-queue" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"batchSize": 100}'

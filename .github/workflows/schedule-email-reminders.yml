name: Schedule Email Reminders

on:
  schedule:
    # A cada 15 minutos, para suportar lembretes de antecedência curta (12h/1h/30min).
    # Atenção: o gatilho "schedule" do GitHub Actions é best-effort — em períodos de alta
    # carga a execução pode atrasar alguns minutos. Um lembrete de "30 min antes" pode, na
    # prática, chegar um pouco depois do previsto (nunca antes).
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  enqueue-and-process:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger notification pipeline
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_BASE_URL or CRON_SECRET is missing in GitHub Actions secrets."
            exit 1
          fi

          BASE_URL="${APP_BASE_URL%/}"

          call_endpoint() {
            local path="$1"
            local body="$2"

            local tmp_headers tmp_body status location
            tmp_headers="$(mktemp)"
            tmp_body="$(mktemp)"

            status=$(curl -sS -o "$tmp_body" -D "$tmp_headers" -w "%{http_code}" \
              -X POST "$BASE_URL$path" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $CRON_SECRET" \
              -d "$body")

            if [ "${status:0:1}" = "3" ]; then
              location=$(grep -i '^location:' "$tmp_headers" | tail -n 1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')
              echo "Unexpected redirect on $path (HTTP $status) -> ${location:-unknown}"
              echo "Response body:"
              cat "$tmp_body"
              rm -f "$tmp_headers" "$tmp_body"
              exit 1
            fi

            if [ "${status:0:1}" != "2" ]; then
              echo "Request failed on $path (HTTP $status)"
              echo "Response body:"
              cat "$tmp_body"
              rm -f "$tmp_headers" "$tmp_body"
              exit 1
            fi

            echo "$path -> HTTP $status"
            cat "$tmp_body"

            rm -f "$tmp_headers" "$tmp_body"
          }

          call_endpoint "/api/notifications/schedule/enqueue-published" '{}'
          call_endpoint "/api/notifications/schedule/enqueue-offset-reminders" '{}'
          call_endpoint "/api/notifications/schedule/process-queue" '{"batchSize": 100}'
          call_endpoint "/api/google-calendar/sync" '{}'

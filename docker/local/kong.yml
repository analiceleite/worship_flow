_format_version: "2.1"
_transform: true
consumers:
  - username: anon
    keyauth_credentials:
      - key: __ANON_KEY__
  - username: service_role
    keyauth_credentials:
      - key: __SERVICE_KEY__
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin
services:
  - name: auth-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-verify
        paths: ["/auth/v1/verify"]
        strip_path: true
    plugins:
      - name: cors
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        paths: ["/auth/v1/"]
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: acl
        config: { allow: [anon, admin], hide_groups_header: true }
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        paths: ["/rest/v1/"]
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: acl
        config: { allow: [anon, admin], hide_groups_header: true }
  - name: storage
    url: http://storage:5000/
    routes:
      - name: storage
        paths: ["/storage/v1/"]
        strip_path: true
    plugins:
      - name: cors
